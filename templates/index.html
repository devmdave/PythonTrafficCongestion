<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Flow Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="wrapper">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="left-section">
                <h1>TMS</h1>
            </div>
        </header>

        <!-- Main Area -->
        <div class="main-grid">
            <!-- Video Feed -->
            <div class="video-section">
                <div class="section-top">
                    <h2>Detection Feed</h2>
                    <button class="restart-btn" id="restartBtn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 4v6h-6M1 20v-6h6"/>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                        </svg>
                        Restart
                    </button>
                </div>
                <div class="video-box">
                    <img id="videoFeed" src="{{ url_for('video_feed') }}" alt="Traffic Feed">
                </div>
            </div>

            <!-- Right Panel -->
            <div class="right-panel">
                <!-- Stats Grid -->
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-icon">🚗</span>
                        <div class="stat-info">
                            <p class="stat-label">Vehicles</p>
                            <p class="stat-value" id="vehicles">0</p>
                        </div>
                    </div>
                    <div class="stat-box">
                        <span class="stat-icon">⚡</span>
                        <div class="stat-info">
                            <p class="stat-label">Speed</p>
                            <p class="stat-value" id="speed">0 <small>km/h</small></p>
                        </div>
                    </div>
                    <div class="stat-box">
                        <span class="stat-icon">📊</span>
                        <div class="stat-info">
                            <p class="stat-label">Accuracy</p>
                            <p class="stat-value" id="accuracy">0.0</p>
                        </div>
                    </div>
                    <div class="stat-box">
                        <span class="stat-icon">🎯</span>
                        <div class="stat-info">
                            <p class="stat-label">FPS</p>
                            <p class="stat-value" id="fps">0</p>
                        </div>
                    </div>
                </div>

                <!-- Parameters -->
                <div class="params-section">
                    <h3>Traffic Params</h3>
                    <div class="params-list">
                        <div class="param-row">
                            <span>Density</span>
                            <span id="density">0.000</span>
                        </div>
                        <div class="param-row">
                            <span>Flow Rate</span>
                            <span id="flow">0.000</span>
                        </div>
                        <div class="param-row">
                            <span>Headway</span>
                            <span id="headway">0.000</span>
                        </div>
                        <div class="param-row">
                            <span>Up Count</span>
                            <span id="vehiclesUp">0</span>
                        </div>
                        <div class="param-row">
                            <span>Down Count</span>
                            <span id="vehiclesDown">0</span>
                        </div>
                    </div>
                </div>

                <!-- System Info -->
                <div class="info-section">
                    <h3>System Info</h3>
                    <div class="info-list">
                        <div class="info-row">
                            <span>Model</span>
                            <span>YOLOv8n</span>
                        </div>
                        <div class="info-row">
                            <span>Classes</span>
                            <span>Car, Truck, Bus</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
